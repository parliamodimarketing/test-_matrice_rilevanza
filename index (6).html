<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dove sei sulla mappa? | Where are you on the map?</title>
<meta name="description" content="Otto domande per collocare il tuo brand nella matrice della rilevanza. Eight questions to place your brand on the relevance matrix.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Plus Jakarta Sans",sans-serif;background:#FAFAF7;color:#1a1a1a;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit}
#p-lang,#p-intro,#p-test,#p-res{min-height:100vh;padding:40px 20px}
.wrap{max-width:500px;margin:0 auto}
.btn{padding:14px 40px;border-radius:8px;border:none;font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;background:#D4922A;color:#fff;box-shadow:0 2px 8px rgba(212,146,42,.25)}
.btn:disabled{background:#E8E5DF;color:#bbb;box-shadow:none;cursor:default}
.langbtn{padding:16px 44px;border-radius:10px;border:2px solid #E8E5DF;background:#fff;font-size:16px;font-weight:700;color:#1a1a1a;margin:8px;min-width:180px;transition:all .2s}
.langbtn:hover{border-color:#D4922A;background:#FBF3E6;color:#A06D10}
.card{background:#fff;border-radius:12px;padding:22px;border:1px solid #E8E5DF;margin-bottom:10px;transition:all .3s}
.card.done{border-color:#ccc;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.qbtn{flex:1;padding:11px 0;border-radius:8px;border:1px solid #E8E5DF;background:#FAFAF7;color:#888;font-size:14px;font-weight:500;transition:all .2s}
.qbtn.si{border:2px solid #D4922A;background:#FBF3E6;color:#A06D10;font-weight:700}
.qbtn.no{border:2px solid #999;background:#F5F5F3;color:#1a1a1a;font-weight:700}
.bar{width:100%;height:3px;background:#E8E5DF;border-radius:3px;overflow:hidden;margin-bottom:28px}
.fill{height:100%;background:#D4922A;border-radius:3px;transition:width .4s}
.perche{background:none;border:none;color:#A06D10;font-size:12px;font-weight:700;padding:0;margin-bottom:16px;display:inline-flex;align-items:center;gap:5px;letter-spacing:.3px}
.perche:hover{text-decoration:underline}
.spieg{font-size:13px;color:#666;line-height:1.65;margin-bottom:18px;padding:14px 16px;background:#FAFAF7;border-radius:8px;border:1px solid #EFEDE7}
.spieg p{margin-bottom:9px}
.spieg p:last-child{margin-bottom:0}
@keyframes pp{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style>
</head>
<body>

<!-- SCHERMATA SCELTA LINGUA -->
<div id="p-lang" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
  <div style="max-width:420px">
    <div style="font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#D4922A;margin-bottom:24px">Parliamo di Marketing</div>
    <h1 style="font-size:30px;font-weight:800;line-height:1.2;margin-bottom:10px">Dove sei sulla mappa?<br><span style="color:#888;font-size:24px">Where are you on the map?</span></h1>
    <p style="font-size:14px;color:#888;margin-bottom:32px;line-height:1.6">Scegli la lingua &middot; Choose your language</p>
    <div>
      <button class="langbtn" onclick="setLang('it')">Italiano</button>
      <button class="langbtn" onclick="setLang('en')">English</button>
    </div>
  </div>
</div>

<!-- INTRO -->
<div id="p-intro" style="display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center">
  <div style="max-width:420px">
    <div id="i-kicker" style="font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#D4922A;margin-bottom:28px"></div>
    <h1 id="i-titolo" style="font-size:34px;font-weight:800;line-height:1.2;margin-bottom:14px"></h1>
    <p id="i-sub1" style="font-size:15px;color:#555;margin-bottom:8px;line-height:1.6"></p>
    <p id="i-sub2" style="font-size:13px;color:#888;margin-bottom:32px;line-height:1.6"></p>
    <button class="btn" id="i-inizia" onclick="inizia()"></button>
    <div style="margin-top:40px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap">
      <span id="i-tag1" style="font-size:10px;color:#bbb;font-weight:700;letter-spacing:1.5px;text-transform:uppercase"></span>
      <span id="i-tag2" style="font-size:10px;color:#bbb;font-weight:700;letter-spacing:1.5px;text-transform:uppercase"></span>
    </div>
  </div>
</div>

<!-- TEST -->
<div id="p-test" style="display:none">
  <div class="wrap">
    <div style="text-align:center;margin-bottom:24px">
      <h2 id="t-titolo" style="font-size:22px;font-weight:800;margin-bottom:8px"></h2>
      <p id="cnt" style="font-size:12px;color:#888;margin-bottom:12px"></p>
      <div class="bar"><div class="fill" id="bf" style="width:0"></div></div>
    </div>
    <div id="t-ax1" style="font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#D4922A;margin-bottom:6px"></div>
    <p id="t-ax1s" style="font-size:13px;color:#888;margin-bottom:14px"></p>
    <div id="box1"></div>
    <div style="height:22px"></div>
    <div id="t-ax2" style="font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#D4922A;margin-bottom:6px"></div>
    <p id="t-ax2s" style="font-size:13px;color:#888;margin-bottom:14px"></p>
    <div id="box2"></div>
    <div style="height:28px"></div>
    <div style="border-top:1px solid #E8E5DF;padding-top:24px">
      <div id="t-duecose" style="font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#D4922A;margin-bottom:6px"></div>
      <p id="t-duecose-s" style="font-size:13px;color:#888;margin-bottom:18px"></p>
      <label id="t-settore-l" style="display:block;font-size:14px;font-weight:600;margin-bottom:8px"></label>
      <select id="settore" onchange="checkPronto()" style="width:100%;padding:12px;border-radius:8px;border:1px solid #E8E5DF;background:#FAFAF7;font-size:15px;font-family:inherit;color:#1a1a1a;margin-bottom:20px"></select>
      <label id="t-dim-l" style="display:block;font-size:14px;font-weight:600;margin-bottom:10px"></label>
      <div id="dimBox" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"></div>
    </div>
    <div style="text-align:center;padding:20px 0">
      <button class="btn" id="bSub" disabled onclick="risultati()"></button>
    </div>
  </div>
</div>

<div id="p-res" style="display:none"><div class="wrap" id="resBox"></div></div>

<script>
var DOMANDE = [{"id": 1, "ax": "pot", "it": {"n": "1. Problema sentito", "q": "Il tuo brand risolve un problema che il cliente sente davvero importante?", "s": ["Ti sei mai chiesto se il tuo prodotto risolve un problema che il tuo cliente ritiene davvero importante? Pensa alle evidenze che hai raccolto: conversazioni con i clienti, motivazioni d'acquisto, rinnovi, feedback, trattative vinte o perse. Quello che offri risponde a qualcosa che, per quel pubblico, ha un peso reale?", "Qui il termine “problema” va inteso in senso ampio: può essere un bisogno funzionale o economico, ma anche un desiderio, un risultato che la persona vuole raggiungere, un bisogno di appartenenza, status, riconoscimento o espressione di sé.", "Un brand con rilevanza potenziale non è semplicemente un'opzione in più: ha la capacità di rispondere a qualcosa che, per quel pubblico, conta davvero."]}, "en": {"n": "1. A felt problem", "q": "Does your brand solve a problem your customer genuinely cares about?", "s": ["Think about the evidence you've gathered: customer conversations, reasons for buying, renewals, feedback, deals won and lost. Does what you offer answer something that truly weighs for that audience?", "“Problem” here is broad — it can be a functional or economic need, but also a desire, an outcome someone wants to reach, a need for belonging, status, recognition, or self-expression.", "A brand with potential relevance isn't just one more option: it has the capacity to answer something that genuinely matters to that audience."]}}, {"id": 2, "ax": "pot", "it": {"n": "2. Difficile da sostituire", "q": "Quello che il tuo brand offre sarebbe difficile da sostituire per il target che hai in mente?", "s": ["Pensa al pubblico che hai scelto e alle alternative concrete che ha a disposizione. Sulla base delle evidenze che possiedi, se dovesse rinunciare alla tua offerta troverebbe facilmente qualcosa di equivalente oppure perderebbe qualcosa che per lui conta?", "Può essere un risultato, una qualità, un'esperienza, una relazione, una competenza, una semplicità, una convenienza o un modo particolare di ottenere ciò che cerca.", "Non significa che il tuo brand debba essere unico o privo di concorrenti. La domanda è un'altra: quanto facilmente un'alternativa potrebbe sostituire ciò che la tua offerta è in grado di rappresentare o produrre per quel pubblico?", "Più le alternative risultano equivalenti rispetto a ciò che per quel pubblico conta, più debole è la rilevanza potenziale. Più la sostituzione comporta la perdita di qualcosa di significativo, più esiste una ragione concreta perché quel brand continui a contare."]}, "en": {"n": "2. Hard to replace", "q": "Would what you offer be hard to replace for the audience you have in mind?", "s": ["Think about the audience you've chosen and the real alternatives available to them. Based on the evidence you have, if they had to give up your offering, would they easily find something equivalent — or would they lose something that matters to them?", "It could be an outcome, a quality, an experience, a relationship, a competence, a simplicity, a convenience, or a particular way of getting what they're after.", "This doesn't mean your brand has to be unique or without competitors. The question is different: how easily could an alternative replace what your offering represents or produces for that audience?", "The more the alternatives feel equivalent, the weaker your potential relevance. The more replacing you would mean losing something significant, the stronger the reason for that brand to keep mattering."]}}, {"id": 3, "ax": "pot", "it": {"n": "3. Qualità distintiva", "q": "Quello che vendi ha una qualità, un'esperienza o una capacità che pochi altri nel mercato hanno davvero?", "s": ["Prova a distinguere ciò che il brand racconta da ciò che il pubblico può effettivamente sperimentare. Al di là dei claim, del linguaggio promozionale e della presentazione commerciale, esiste qualcosa di reale che rende l'offerta diversa dalle alternative?", "Può essere una qualità del prodotto, un'esperienza, una competenza, un processo, un ingrediente, un'infrastruttura, una relazione, un know-how, un modello di servizio o una capacità costruita nel tempo.", "Non deve essere necessariamente unico al mondo o impossibile da copiare. Deve però essere reale, significativo per quel pubblico e sufficientemente distintivo da contribuire alla ragione per cui il brand può contare.", "Se fai fatica a indicare con precisione quale elemento produce questa differenza, chiediti quali evidenze hai per sostenerla e se ciò che dall'interno consideri speciale lo sia davvero rispetto alle alternative concrete."]}, "en": {"n": "3. Distinctive quality", "q": "Does what you sell have a quality, an experience, or a capability that few others in the market genuinely have?", "s": ["Try to separate what the brand claims from what the audience can actually experience. Beyond the claims, the promotional language and the sales presentation, is there something real that makes the offering different from the alternatives?", "It could be a product quality, an experience, a competence, a process, an ingredient, an infrastructure, a relationship, a know-how, a service model, or a capability built over time.", "It doesn't have to be unique in the world or impossible to copy. But it must be real, meaningful to that audience, and distinctive enough to contribute to the reason the brand can matter.", "If you struggle to point precisely to what creates this difference, ask yourself what evidence you have for it — and whether what you consider special from the inside really is, compared to the concrete alternatives."]}}, {"id": 4, "ax": "pot", "it": {"n": "4. Test della scomparsa", "q": "Se il tuo brand domani smettesse di esistere, la sua assenza lascerebbe un vuoto significativo per il pubblico che ti conosce?", "s": ["Pensa al pubblico che hai scelto e alle evidenze raccolte nel tempo, e cerca la risposta di chi conosce o utilizza l'offerta, anche se l'ha abbandonata: chi non la conosce non può sentirne la mancanza. Se il tuo brand smettesse di esistere, la sua assenza lascerebbe un vuoto riconoscibile per quelle persone oppure il passaggio a un'alternativa sarebbe quasi indifferente?", "Quel vuoto può riguardare un risultato, un'esperienza, una relazione, una sicurezza, un'abitudine significativa, un modo particolare di risolvere un problema o di ottenere qualcosa che per quel pubblico conta.", "Questa domanda non misura quante alternative esistono, ma quanto peserebbe la tua assenza. Un brand può avere molti sostituti sulla carta e lasciare comunque un vuoto difficile da colmare.", "Più l'assenza del brand comporterebbe la perdita di qualcosa di significativo per quel pubblico, più forte è il segnale di rilevanza potenziale."]}, "en": {"n": "4. The disappearance test", "q": "If your brand disappeared tomorrow, would its absence leave a meaningful gap for the audience that knows you?", "s": ["Think about the audience you've chosen and the evidence gathered over time, and look for the answer from those who know or use the offering, even if they've left it: those who don't know it can't miss it. If your brand ceased to exist, would its absence leave a recognizable gap for those people — or would switching to an alternative be almost effortless?", "That gap could involve an outcome, an experience, a relationship, a sense of security, a meaningful habit, a particular way of solving a problem or getting something that matters to that audience.", "This question doesn't measure how many alternatives exist, but how much your absence would weigh. A brand can have many substitutes on paper and still leave a gap that's hard to fill.", "The more your brand's absence would mean losing something significant, the stronger the signal of potential relevance."]}}, {"id": 5, "ax": "per", "it": {"n": "5. Risposta a qualcosa che conta", "q": "Il tuo brand viene riconosciuto come una risposta a qualcosa che conta?", "s": ["Pensa allo stesso pubblico, allo stesso bisogno e allo stesso momento di scelta che hai definito all'inizio del test. Sulla base delle evidenze disponibili, le persone collegano il brand a qualcosa che per loro ha un peso reale?", "Può essere un bisogno funzionale o economico, un risultato che vogliono ottenere, ma anche un desiderio, una sicurezza, un'appartenenza, uno status, un riconoscimento o un modo di esprimere se stessi. Il punto non è quale di queste leve sia in gioco, ma se il pubblico riesca ad associare il brand a qualcosa che considera significativo.", "Non basta che il brand sia conosciuto, ricordato o riconoscibile. Una persona può sapere perfettamente chi sei senza associare alla tua offerta una ragione che abbia valore per lei. Allo stesso modo, non è necessario che il brand venga nominato spontaneamente prima di essere incontrato: questa domanda riguarda ciò che le persone gli riconoscono quando entra nel loro campo di scelta.", "Cerca le evidenze nelle motivazioni espresse dai clienti, nelle ricerche qualitative, nelle recensioni, nelle richieste commerciali, nelle conversazioni e negli altri segnali che permettono di capire che cosa le persone associano davvero al brand."]}, "en": {"n": "5. A response to something that matters", "q": "Is your brand recognized as a response to something that matters?", "s": ["Think about the same audience, the same need and the same moment of choice you defined at the start of the test. Based on the available evidence, do people link the brand to something that genuinely weighs for them?", "It can be a functional or economic need, an outcome they want, but also a desire, a sense of security, belonging, status, recognition, or a way of expressing themselves. The point isn't which of these is at play, but whether the audience can associate the brand with something they consider significant.", "It's not enough for the brand to be known, remembered or recognizable. A person can know exactly who you are without associating your offering with a reason that has value for them. And the brand doesn't need to be named spontaneously beforehand: this question is about what people recognize in it once it enters their field of choice.", "Look for evidence in the reasons customers give, in qualitative research, in reviews, in sales inquiries, in conversations and in the other signals that reveal what people truly associate with the brand."]}}, {"id": 6, "ax": "per", "it": {"n": "6. Sanno spiegare perché", "q": "Le persone sanno spiegare, con parole loro, perché il tuo brand potrebbe contare per loro?", "s": ["Chiediti che cosa succede quando le persone che hai scelto provano a raccontare il tuo brand senza utilizzare le parole dell'azienda. Riescono a spiegare che cosa offre, quale valore riconoscono e perché quel valore potrebbe essere significativo nella situazione che hai scelto?", "Le parole possono essere completamente diverse da quelle utilizzate dall'azienda: non stai cercando la ripetizione dello slogan, della value proposition o del linguaggio della comunicazione. Ciò che conta è che il significato restituito dal pubblico sia comprensibile e sufficientemente coerente.", "Una persona può associare un brand a qualcosa di importante e tuttavia avere un'idea vaga, parziale o confusa del valore che offre in relazione a quel bisogno. È questa la differenza rispetto alla domanda precedente: la domanda 5 verifica se esiste un'associazione significativa; qui verifichi se il valore associato al brand è diventato abbastanza leggibile da poter essere spiegato.", "Quando persone diverse riescono a restituire, con parole proprie, una ragione riconoscibile per cui il brand potrebbe contare, il valore non è soltanto presente nella loro percezione: è diventato comprensibile."]}, "en": {"n": "6. They can explain why", "q": "Can people explain, in their own words, why your brand might matter to them?", "s": ["Ask yourself what happens when the people you've chosen try to describe your brand without using the company's words. Can they explain what it offers, what value they recognize and why that value might be significant in the situation you've chosen?", "The words can be completely different from the company's: you're not looking for the slogan, the value proposition or the communication language repeated back. What matters is that the meaning people give back is understandable and consistent enough.", "A person can associate a brand with something important and still have a vague, partial or confused idea of the value it offers for that need. This is the difference from the previous question: question 5 checks whether a meaningful association exists; here you check whether the associated value has become legible enough to be explained.", "When different people can give back, in their own words, a recognizable reason why the brand might matter, the value isn't only present in their perception: it has become understandable."]}}, {"id": 7, "ax": "per", "it": {"n": "7. Differenza riconosciuta", "q": "Il pubblico riconosce nel tuo brand una ragione significativa per valutarlo diversamente dalle alternative?", "s": ["Ora porta il confronto dentro il momento della scelta. Quando le persone mettono il brand accanto alle alternative che potrebbero realmente scegliere, riconoscono qualcosa che renda la tua offerta significativamente diversa per loro?", "Non deve trattarsi necessariamente di una caratteristica unica o esclusiva. Può essere una qualità, un'esperienza, una relazione, una competenza, una convenienza, un valore simbolico, una sicurezza o un modo particolare di ottenere il risultato cercato. Ciò che conta è che quella differenza venga riconosciuta dal pubblico e abbia un significato nel confronto con le alternative.", "Questo passaggio è importante perché comprendere un brand non significa ancora attribuirgli una ragione per valutarlo diversamente. Le persone possono sapere perfettamente che cosa fai e continuare a percepirti come sostanzialmente intercambiabile con altre opzioni.", "Cerca evidenze nei confronti espliciti con i concorrenti, nelle ragioni dichiarate per includere o escludere il brand, nelle recensioni comparative, nelle trattative, nelle ricerche qualitative e nei criteri che emergono quando le persone spiegano perché una possibilità sembra più adatta di un'altra."]}, "en": {"n": "7. A recognized difference", "q": "Does the audience recognize in your brand a meaningful reason to judge it differently from the alternatives?", "s": ["Now bring the comparison into the moment of choice. When people put the brand next to the alternatives they could really choose, do they recognize something that makes your offering significantly different for them?", "It doesn't have to be a unique or exclusive feature. It can be a quality, an experience, a relationship, a competence, a convenience, a symbolic value, a reassurance or a particular way of getting the result they seek. What matters is that the difference is recognized by the audience and carries meaning in the comparison with alternatives.", "This step matters because understanding a brand doesn't yet mean giving it a reason to be judged differently. People can know exactly what you do and still see you as essentially interchangeable with other options.", "Look for evidence in explicit comparisons with competitors, in the stated reasons to include or exclude the brand, in comparative reviews, in negotiations, in qualitative research and in the criteria that emerge when people explain why one option seems more suitable than another."]}}, {"id": 8, "ax": "per", "it": {"n": "8. Presa in considerazione", "q": "Nel momento di scelta che hai definito, il tuo brand entra concretamente tra le alternative considerate?", "s": ["A questo punto chiediti se il brand diventa una possibilità reale. Quando il pubblico che hai scelto deve decidere, il brand entra effettivamente tra le alternative che prende in esame?", "Puoi cercarne traccia nelle shortlist, nelle richieste di informazioni, nei confronti con i concorrenti, nelle prove, nelle trattative, nelle richieste di preventivo o negli altri comportamenti che, nella tua categoria, mostrano che il brand viene preso seriamente in considerazione.", "Essere considerati non significa essere scelti. Una persona può riconoscere il valore del brand, inserirlo tra le alternative e infine scegliere altro per ragioni di prezzo, disponibilità, abitudine o priorità contingenti. La mancata vendita, da sola, non dimostra una mancanza di rilevanza riconosciuta: qui interessa capire se il valore viene riconosciuto abbastanza da entrare nella decisione, anche quando la scelta finale ricade altrove.", "Questa domanda verifica un esito, non una quarta dimensione indipendente. Poiché la considerazione può dipendere anche da notorietà, abitudine e disponibilità, la risposta va letta insieme alle domande 5, 6 e 7. Quando accade, non sappiamo ancora quale sarà la scelta finale: sappiamo però che il brand è riuscito a entrare realmente nel campo della scelta."]}, "en": {"n": "8. Taken into consideration", "q": "At the moment of choice you've defined, does your brand concretely enter the alternatives considered?", "s": ["Now ask whether the brand becomes a real possibility. When the audience you've chosen has to decide, does the brand actually enter the alternatives they examine?", "You can look for traces in shortlists, requests for information, comparisons with competitors, trials, negotiations, quote requests or the other behaviors that, in your category, show a brand is being seriously considered.", "Being considered doesn't mean being chosen. A person can recognize the brand's value, include it among the alternatives, and finally choose otherwise for reasons of price, availability, habit or momentary priorities. A lost sale alone doesn't prove a lack of recognized relevance: here we want to know whether the value is recognized enough to enter the decision, even when the final choice falls elsewhere.", "This question checks an outcome, not a fourth independent dimension. Since consideration can also depend on awareness, habit and availability, read the answer together with questions 5, 6 and 7. When it happens, we don't yet know the final choice: but we know the brand has genuinely entered the field of choice."]}}];
var QUADRANTI = {"invisibile": {"cod": "Q1", "col": "#999", "sfondo": "#F5F5F3", "xy": "basso-sx", "it": {"nome": "Invisibile", "desc": "Né sostanza distintiva né presenza nella mente del cliente.", "prob": "Il problema non è la comunicazione. È la mancanza di una ragione forte per essere scelti.", "az": [["Il lavoro", "Costruisci sostanza e chiarezza prima di alzare la voce."]], "avviso": "Amplificare un brand che non ha ancora sostanza distintiva significa rendere più visibile un vuoto.", "esempio": "Per esempio: Nokia."}, "en": {"nome": "Invisible", "desc": "Neither distinctive substance nor presence in the customer's mind.", "prob": "It's not a communication problem. It's the lack of a strong reason to be chosen.", "az": [["The work", "Build substance and clarity before raising your voice."]], "avviso": "Amplifying a brand that doesn't yet have distinctive substance means making a void more visible.", "esempio": "For example: Nokia."}}, "promessa": {"cod": "Q2", "col": "#C75D3A", "sfondo": "#FDF5F2", "xy": "alto-sx", "it": {"nome": "Promessa fragile", "desc": "La percezione è corsa avanti. La sostanza non c'è ancora.", "prob": "Il mercato ha creduto a una promessa che il brand non è ancora in grado di mantenere.", "az": [["Il lavoro", "Riallinea la promessa all'esperienza reale."]], "avviso": "Il tempo lavora contro il brand. Ogni giorno in cui la promessa resta più alta della realtà rende il gap più visibile.", "esempio": "Per esempio: Mr Beast Burger."}, "en": {"nome": "Fragile Promise", "desc": "Perception has run ahead. The substance isn't there yet.", "prob": "The market believed a promise the brand can't yet keep.", "az": [["The work", "Realign the promise with the real experience."]], "avviso": "Time works against the brand. Every day the promise stays higher than reality makes the gap more visible.", "esempio": "For example: Mr Beast Burger."}}, "sottovalutato": {"cod": "Q3", "col": "#2E7DAF", "sfondo": "#F2F7FB", "xy": "basso-dx", "it": {"nome": "Sottov function disegna(){
  var b1=document.getElementById("box1"), b2=document.getElementById("box2");
  b1.innerHTML=""; b2.innerHTML="";
  for(var i=0;i<DOMANDE.length;i++){
    var d=DOMANDE[i], t=d[lang];
    var html='<div class="card'+(ans[d.id]!==undefined?' done':'')+'">';
    html+='<div style="font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin-bottom:10px">'+t.n+'</div>';

    html+='<button class="perche" onclick="toggle('+d.id+')">'+(apri[d.id]?'&minus; '+T("nascondi"):'&#43; '+T("perche"))+'</button>';

function scegliDim(f){ dimSel=f; disegnaDim(); checkPronto(); }

function aggiorna(){
  var n=Object.keys(ans).length;
  document.getElementById("cnt").textContent=n+" "+T("di")+" 8";
  document.getElementById("bf").style.width=(n/8*100)+"%";
  checkPronto();
}
function checkPronto(){
  var n=Object.keys(ans).length;
  var settore=document.getElementById("settore")?document.getElementById("settore").value:"";
  var b=document.getElementById("bSub");
  if(n===8 && settore && dimSel){ b.disabled=false; b.textContent=T("scopri"); }
  else { b.disabled=true; if(n<8) b.textContent=n+"/8 "+T("domande"); else b.textContent=T("completa"); }
}

  h+='</div>';
    h+='<div style="text-align:center;margin:32px 0 20px;padding:24px 20px;background:#FBF7EF;border-radius:12px;border:1px solid #EDD9A8">';

function scaricaMatrice(){
  var R = window.RIS; if(!R) return;
  var S = 1080;                 // immagine quadrata 1080x1080
  var cv = document.createElement("canvas");
  cv.width = S; cv.height = S;
  var c = cv.getContext("2d");
  // sfondo crema (come il test)
  c.fillStyle = "#FAFAF7"; c.fillRect(0,0,S,S);
  // titolo
  c.fillStyle = "#1a1a1a"; c.textAlign = "center";
  c.font = "800 46px 'Plus Jakarta Sans', sans-serif";
  c.fillText(lang==="it" ? "Dove sei sulla mappa" : "Where you are on the map", S/2, 90);
  // quadrante nome
  c.fillStyle = R.col; c.font = "800 40px 'Plus Jakarta Sans', sans-serif";
  c.fillText(R.cod + "  " + R.nome, S/2, 150);
  // gabbia matrice: quadrata, lascio spazio sotto per i punteggi
  var box = 640;
  var x0 = (S - box)/2, y0 = 200;
  // quattro sfondi quadranti
  c.fillStyle = "#FDF5F2"; c.fillRect(x0, y0, box/2, box/2);           // Q2 alto-sx
  c.fillStyle = "#FBF7EF"; c.fillRect(x0+box/2, y0, box/2, box/2);     // Q4 alto-dx
  c.fillStyle = "#F7F7F5"; c.fillRect(x0, y0+box/2, box/2, box/2);     // Q1 basso-sx
  c.fillStyle = "#F2F7FB"; c.fillRect(x0+box/2, y0+box/2, box/2, box/2);// Q3 basso-dx
  // cornice e assi
  c.strokeStyle = "#ddd"; c.lineWidth = 2;
  c.strokeRect(x0, y0, box, box);
  c.beginPath(); c.moveTo(x0+box/2, y0); c.lineTo(x0+box/2, y0+box); c.stroke();
  c.beginPath(); c.moveTo(x0, y0+box/2); c.lineTo(x0+box, y0+box/2); c.stroke();
  // etichette quadranti
  c.font = "700 20px 'Plus Jakarta Sans', sans-serif"; c.textAlign="center";
  var Qn = {q1:QUADRANTI.invisibile[lang].nome, q2:QUADRANTI.promessa[lang].nome, q3:QUADRANTI.sottovalutato[lang].nome, q4:QUADRANTI.rilevante[lang].nome};
  c.fillStyle="#bbb"; c.fillText("Q1 "+Qn.q1, x0+box/4, y0+box*0.75);
  c.fillStyle="#7AABCC"; c.fillText("Q3 "+Qn.q3, x0+box*3/4, y0+box*0.75);
  c.fillStyle="#D4845A"; c.fillText("Q2 "+Qn.q2, x0+box/4, y0+box*0.25);
  c.fillStyle="#C9A050"; c.fillText("Q4 "+Qn.q4, x0+box*3/4, y0+box*0.25);
  // pallino TU: xP=12+(ps/4)*76 %, yP=88-(rs/4)*76 % dentro la gabbia
  var px = x0 + box*(12+(R.ps/4)*76)/100;
  var py = y0 + box*(88-(R.rs/4)*76)/100;
  c.beginPath(); c.arc(px, py, 32, 0, 2*Math.PI);
  c.fillStyle = R.col; c.fill();
  c.fillStyle = "#fff"; c.font = "800 18px 'Plus Jakarta Sans', sans-serif";
  c.fillText(lang==="it"?"TU":"YOU", px, py+6);
  // etichette assi
  c.fillStyle="#bbb"; c.font="700 16px 'Plus Jakarta Sans', sans-serif";
  c.fillText((lang==="it"?"POTENZIALE \u2192":"POTENTIAL \u2192"), S/2, y0+box+34);
  c.save();
  c.translate(x0-30, y0+box/2); c.rotate(-Math.PI/2);
  c.fillText((lang==="it"?"PERCEPITA \u2192":"PERCEIVED \u2192"), 0, 0);
  c.restore();
  // punteggi in basso, due riquadri
  var by = y0+box+80;
  c.textAlign="center";
  c.fillStyle="#888"; c.font="700 20px 'Plus Jakarta Sans', sans-serif";
  c.fillText((lang==="it"?"POTENZIALE":"POTENTIAL"), S/2-170, by);
  c.fillText((lang==="it"?"PERCEPITA":"PERCEIVED"), S/2+170, by);
  c.fillStyle="#1a1a1a"; c.font="800 60px 'Plus Jakarta Sans', sans-serif";
  c.fillText(R.ps+"/4", S/2-170, by+62);
  c.fillText(R.rs+"/4", S/2+170, by+62);
  // firma sito piccola
  c.fillStyle="#bbb"; c.font="500 22px 'Plus Jakarta Sans', sans-serif";
  c.fillText("parliamodimarketing.it", S/2, S-50);
  // scarico
  var link = document.createElement("a");
  link.download = (lang==="it"?"la-mia-matrice.png":"my-matrix.png");
  link.href = cv.toDataURL("image/png");
  link.click();
}
